<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="neurolens-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neuro Accent Gradient (Teal to Cyan) -->
    <linearGradient id="neurolens-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="32" height="32" rx="7" fill="url(#neurolens-bg)"/>
  <rect width="30.5" height="30.5" x="0.75" y="0.75" rx="6.25" fill="none" stroke="url(#neurolens-accent)" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- Optical Lens / Scan Ring -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-dasharray="2 1.5" stroke-opacity="0.4"/>
  <circle cx="16" cy="16" r="7.5" fill="#14b8a6" fill-opacity="0.08"/>

  <!-- Precision Scanner Crosshairs (Lens Reticle) -->
  <line x1="16" y1="2.5" x2="16" y2="4.5" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="27.5" x2="16" y2="29.5" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="2.5" y1="16" x2="4.5" y2="16" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="27.5" y1="16" x2="29.5" y2="16" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Central Brain Geometry -->
  <g transform="translate(4, 4)" stroke="url(#neurolens-accent)" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <!-- Right hemisphere -->
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <!-- Neural tracks -->
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
    <path d="M12 18v4"/>
    <path d="M8 17a3 3 0 0 1 4-2 3 3 0 0 1 4 2"/>
  </g>

  <!-- Lens Focal Center Aperture Point -->
  <circle cx="16" cy="16" r="2.2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="16" cy="16" r="0.9" fill="#ffffff"/>
</svg>